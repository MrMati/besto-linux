# The image ships without host keys on purpose, so every board gets its own.
# Debian's sshd-keygen.service only runs on the very first boot, and if that
# detection misfires for any reason the result is an appliance that has no
# host keys and never will:
#
#   sshd-keygen.service - Generate sshd host keys on first boot skipped,
#                         unmet condition check ConditionFirstBoot=yes
#   sshd: no hostkeys available -- exiting.
#
# followed by ssh.service restarting five times and giving up, on every boot.
# Key by the thing we actually care about instead: no host key, no SSH.
[Unit]
ConditionFirstBoot=
ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
