# Tuned for 256MB with zram swap in front of it: swap early and in big chunks,
# because compressed RAM is cheap and refaulting from NAND or SD is not.
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 200
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
# Leave enough for the NPU's CMA allocations and the network stack to make
# progress under memory pressure.
vm.min_free_kbytes = 8192
