# The canonical place for the locale on a systemd system, and the only place
# worth writing it: systemd ships
#
#   L+ /etc/default/locale - - - - ../locale.conf
#
# in /usr/lib/tmpfiles.d/debian.conf, so systemd-tmpfiles replaces
# /etc/default/locale with a symlink to this file on every single boot. A real
# file there is deleted before anything has a chance to read it, which is why
# every login used to log "pam_env(login:session): Unable to open env file:
# /etc/default/locale" -- the symlink was there, this file was not.
#
# C.UTF-8 is built into glibc, so it needs no locales package and no
# locale-gen on a 256MB board.
LANG=C.UTF-8
