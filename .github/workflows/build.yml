name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  check:
    name: check (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [luckfox-pico-max, luckfox-pico-mini]
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4
      - run: make check

  uboot:
    name: u-boot (${{ matrix.board }})
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        board: [luckfox-pico-max, luckfox-pico-mini]
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4
      - name: restore U-Boot and rkbin sources
        uses: actions/cache@v4
        with:
          path: |
            src/u-boot
            src/rkbin
          key: ${{ runner.os }}-uboot-src-${{ hashFiles('scripts/lib.sh') }}
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf build-essential bc bison flex libssl-dev \
            libgnutls28-dev device-tree-compiler python3 python3-dev \
            python3-setuptools python3-pyelftools swig uuid-dev git
      - run: make uboot
      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.board }}
          path: |
            out/idbloader.img
            out/u-boot.img
            out/u-boot-rockchip-usb47*.bin
            out/rv1106_download.bin
          if-no-files-found: error

  kernel:
    name: kernel (${{ matrix.board }})
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        board: [luckfox-pico-max, luckfox-pico-mini]
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4
      - name: restore kernel source
        uses: actions/cache@v4
        with:
          path: src/linux
          key: ${{ runner.os }}-kernel-src-${{ hashFiles('scripts/lib.sh') }}
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf build-essential bc bison flex libssl-dev \
            device-tree-compiler cpio kmod rsync zstd git
      - run: make kernel
      - name: kernel summary
        run: |
          echo "### kernel $BOARD $(cat out/kernel.release)" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            ls -lh out/zImage out/*.dtb | sed 's|out/||'
            echo
            echo "modules: $(find out/modules -name '*.ko' | wc -l)"
            grep -E '^CONFIG_(ZRAM|CGROUPS|EXT4_FS|UBIFS_FS|USB_CONFIGFS_RNDIS)=' out/linux/.config
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.board }}
          path: |
            out/zImage
            out/*.dtb
            out/kernel.release
            out/modules
          if-no-files-found: error

  image:
    name: image (${{ matrix.board }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    needs: [uboot, kernel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: luckfox-pico-max
            profile: minimal
          - board: luckfox-pico-max
            profile: standard
          - board: luckfox-pico-mini
            profile: minimal
    env:
      BOARD: ${{ matrix.board }}
      ROOTFS_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - name: restore Debian base rootfs cache
        uses: actions/cache@v4
        with:
          path: dl/rootfs-base
          key: ${{ runner.os }}-rootfs-${{ matrix.board }}-${{ matrix.profile }}-${{ hashFiles('rootfs/packages/**', 'scripts/build-rootfs.sh', 'board/**/board.env') }}
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mmdebstrap \
            qemu-user qemu-user-static arch-test \
            debian-archive-keyring eatmydata gdisk e2fsprogs mtd-utils zstd \
            fdisk openssl kmod
      - name: register the armhf binfmt handler
        run: |
          # qemu-user-static is not redundant with qemu-user: binfmt dispatch
          # resolves the registered emulator against the root of whoever execs
          # the foreign binary -- inside a chroot, that is the chroot. Only
          # the -static package ships the statically linked emulator that
          # build-rootfs.sh copies into the chroot at exactly the path this
          # entry names; without it every armhf exec in the chroot dies with
          # a misleading "No such file or directory".
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          sudo /usr/lib/systemd/systemd-binfmt
          arch-test armhf
      - uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.board }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.board }}
          path: out
      - run: scripts/build-rootfs.sh
      - run: scripts/mk-image.sh
      - name: compress SD development image
        run: zstd -19 -T0 --rm "out/$BOARD-sdcard.img"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.board }}-${{ matrix.profile }}
          path: |
            out/${{ matrix.board }}-sdcard.img.zst
            out/${{ matrix.board }}-rootfs.ubi
          if-no-files-found: error
