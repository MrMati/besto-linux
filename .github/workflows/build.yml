name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  check:
    name: check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: install the cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - run: make check

  npu:
    name: npu runtime
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: check
    steps:
      - uses: actions/checkout@v4
      # Sticky disk keys are per job, not per repo: a disk can only be mounted
      # by one job at a time, and check/npu/uboot/kernel/image all run in
      # parallel. Sharing one key would serialise the whole workflow.
      - name: mount the download cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-dl-npu
          path: ${{ github.workspace }}/dl
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross git
      - run: make npu
      - uses: actions/upload-artifact@v4
        with:
          name: npu-staging
          path: out/npu-staging
          if-no-files-found: error

  uboot:
    name: u-boot
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: mount the source cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-src-uboot
          path: ${{ github.workspace }}/src
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf build-essential bison flex libssl-dev \
            libgnutls28-dev device-tree-compiler python3 python3-dev \
            python3-setuptools python3-pyelftools swig uuid-dev git
      - run: make uboot
      - uses: actions/upload-artifact@v4
        with:
          name: u-boot
          path: |
            out/idbloader.img
            out/u-boot.img
            out/u-boot-rockchip-usb47*.bin
            out/rv1106_download.bin
          if-no-files-found: error

  kernel:
    name: kernel
    runs-on: blacksmith-16vcpu-ubuntu-2404
    needs: check
    steps:
      - uses: actions/checkout@v4
      # The pinned Rockchip tree is a 266 MiB shallow fetch that lib.sh skips
      # entirely once the ref is already in $SRC.
      - name: mount the source cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-src-kernel
          path: ${{ github.workspace }}/src
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf build-essential bc bison flex libssl-dev \
            device-tree-compiler cpio kmod rsync zstd git
      - run: make kernel
      - name: kernel summary
        run: |
          echo "### kernel $(cat out/kernel.release)" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            ls -lh out/zImage out/*.dtb | sed 's|out/||'
            echo
            echo "modules: $(find out/modules -name '*.ko' | wc -l)"
            grep -E '^CONFIG_(ROCKCHIP_RKNPU|ROCKCHIP_RKNPU_DMA_HEAP|ZRAM|CGROUPS|EXT4_FS|UBIFS_FS)=' out/linux/.config
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            out/zImage
            out/*.dtb
            out/kernel.release
            out/modules
          if-no-files-found: error

  image:
    name: image (${{ matrix.profile }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: [uboot, kernel, npu]
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, standard]
    env:
      ROOTFS_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      # Holds the base rootfs tarball, which is the whole cost of this job:
      # ~120s of qemu-emulated dpkg that depends only on the package list.
      - name: mount the download cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-dl-rootfs-${{ matrix.profile }}
          path: ${{ github.workspace }}/dl
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mmdebstrap qemu-user-static arch-test debian-archive-keyring \
            eatmydata gdisk e2fsprogs mtd-utils zstd fdisk openssl
      - name: register the armhf binfmt handler
        run: |
          # The runner boots without binfmt_misc mounted, so nothing can claim
          # armhf ELFs and mmdebstrap refuses to run maintainer scripts. Mount
          # it, then let systemd-binfmt replay /usr/lib/binfmt.d -- that is
          # where Ubuntu's qemu-user-static keeps its registrations, not in the
          # update-binfmts database.
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          sudo /usr/lib/systemd/systemd-binfmt
          arch-test armhf
      - uses: actions/download-artifact@v4
        with: { name: u-boot, path: out }
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: out }
      - uses: actions/download-artifact@v4
        with: { name: npu-staging, path: out/npu-staging }
      - name: restore permissions lost by the artifact round trip
        run: chmod +x out/npu-staging/usr/bin/* || true
      - run: scripts/build-rootfs.sh
      - run: scripts/mk-image.sh
      - name: image summary
        run: |
          {
            echo "### ${{ matrix.profile }} image"
            echo '```'
            scripts/info.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: compress
        run: zstd -19 -T0 --rm out/luckfox-pico-max-sdcard.img
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.profile }}
          path: |
            out/luckfox-pico-max-sdcard.img.zst
            out/luckfox-pico-max-rootfs.ubi
          if-no-files-found: error
