name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: install the cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - run: make check

  npu:
    name: npu runtime
    runs-on: ubuntu-26.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross git
      - run: make npu
      - uses: actions/upload-artifact@v7
        with:
          name: npu-staging
          path: out/npu-staging
          if-no-files-found: error

  uboot:
    name: u-boot
    runs-on: ubuntu-26.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      # libc6-dev-armhf-cross is not for U-Boot or the OP-TEE core (both are
      # freestanding): the optee-examples step below builds libteec and the
      # example host apps, which are hosted userspace and need the armhf libc
      # headers. It is only a Recommends of the cross gcc, which
      # --no-install-recommends drops.
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross build-essential \
            bison flex libssl-dev libgnutls28-dev device-tree-compiler \
            python3 python3-dev python3-setuptools python3-pyelftools \
            python3-cryptography swig uuid-dev git
      # make uboot builds OP-TEE first (Makefile prerequisite) and packs it
      # into u-boot.img, binman's u-boot.itb.
      - run: make uboot
      # The example TAs build against the dev kit the OP-TEE build just
      # exported, so this job is the cheapest place for them.
      - run: make optee-examples
      - uses: actions/upload-artifact@v7
        with:
          name: u-boot
          path: |
            out/idbloader.img
            out/u-boot.img
            out/u-boot-rockchip-usb47*.bin
            out/rv1106_download.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: optee-examples-staging
          path: out/optee-examples-staging
          if-no-files-found: error

  kernel:
    name: kernel
    runs-on: ubuntu-26.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      # The pinned Rockchip tree is a 266 MiB shallow fetch that lib.sh skips
      # entirely once the ref is already in $SRC.
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf build-essential bc bison flex libssl-dev \
            device-tree-compiler cpio kmod rsync zstd git
      - run: make kernel
      - name: kernel summary
        run: |
          echo "### kernel $(cat out/kernel.release)" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            ls -lh out/zImage out/*.dtb | sed 's|out/||'
            echo
            echo "modules: $(find out/modules -name '*.ko' | wc -l)"
            grep -E '^CONFIG_(ROCKCHIP_RKNPU|ROCKCHIP_RKNPU_DMA_HEAP|ZRAM|CGROUPS|EXT4_FS|UBIFS_FS)=' out/linux/.config
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: |
            out/zImage
            out/*.dtb
            out/kernel.release
            out/modules
          if-no-files-found: error

  image:
    name: image (${{ matrix.profile }})
    runs-on: ubuntu-26.04
    needs: [uboot, kernel, npu]
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, standard]
    env:
      ROOTFS_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mmdebstrap qemu-user-static arch-test debian-archive-keyring \
            eatmydata gdisk e2fsprogs mtd-utils zstd fdisk openssl
      - name: register the armhf binfmt handler
        run: |
          # The runner may boot without binfmt_misc mounted, so nothing can claim
          # armhf ELFs and mmdebstrap refuses to run maintainer scripts. Mount
          # it, then let systemd-binfmt replay /usr/lib/binfmt.d -- that is
          # where Ubuntu's qemu-user-static keeps its registrations, not in the
          # update-binfmts database.
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          sudo /usr/lib/systemd/systemd-binfmt
          arch-test armhf
      - uses: actions/download-artifact@v8
        with: { name: u-boot, path: out }
      - uses: actions/download-artifact@v8
        with: { name: kernel, path: out }
      - uses: actions/download-artifact@v8
        with: { name: npu-staging, path: out/npu-staging }
      - uses: actions/download-artifact@v8
        with: { name: optee-examples-staging, path: out/optee-examples-staging }
      - name: restore permissions lost by the artifact round trip
        run: |
          chmod +x out/npu-staging/usr/bin/* || true
          chmod +x out/optee-examples-staging/usr/bin/* || true
      - run: scripts/build-rootfs.sh
      - run: scripts/mk-image.sh
      - name: image summary
        run: |
          {
            echo "### ${{ matrix.profile }} image"
            echo '```'
            scripts/info.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: compress
        run: zstd -19 -T0 --rm out/luckfox-pico-max-sdcard.img
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.profile }}
          path: |
            out/luckfox-pico-max-sdcard.img.zst
            out/luckfox-pico-max-rootfs.ubi
          if-no-files-found: error
